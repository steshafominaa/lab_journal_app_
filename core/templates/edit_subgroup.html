<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Изменить подгруппу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width: 400px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Подгруппа</h1>
        <a href="{% url 'manage_subgroups' %}" class="btn btn-outline-secondary">Назад</a>
    </div>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" name="subgroup_name" class="form-control" value="{{ subgroup.subgroup_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Преподаватель</label>
            <select name="teacher_id" class="form-select" required>
                {% for teacher in teachers %}
                    <option value="{{ teacher.pk }}" {% if teacher.pk == subgroup.teacher_id %}selected{% endif %}>
                        {{ teacher }}{% if teacher.is_admin %} (админ){% endif %}
                    </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>
</body>
</html>
