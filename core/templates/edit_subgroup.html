{% extends 'base.html' %}

{% block title %}Подгруппа{% endblock %}

{% block card_class %}content-card--narrow{% endblock %}

{% block content %}
    <div class="page-header">
        <h1>Подгруппа</h1>
        <a href="{% url 'manage_subgroups' %}" class="btn btn-outline-secondary">Назад</a>
    </div>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" name="subgroup_name" class="form-control" value="{{ subgroup.subgroup_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Преподаватель</label>
            <select name="teacher_id" class="form-select" required>
                {% for teacher in teachers %}
                    <option value="{{ teacher.pk }}" {% if teacher.pk == subgroup.teacher_id %}selected{% endif %}>
                        {{ teacher }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
{% endblock %}
