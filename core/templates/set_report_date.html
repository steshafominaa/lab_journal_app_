<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дата сдачи отчёта</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 400px; margin-top: 100px;">
    <h4>{{ lab_work.title }}</h4>
    <p>Студент: {{ student }}</p>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="student_id" value="{{ student.pk }}">
        <div class="mb-3">
            <label class="form-label">Дата сдачи отчёта</label>
            <input type="date" name="submitted_at" class="form-control"
                   value="{{ report.submitted_at|date:'Y-m-d' }}">
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'teacher_dashboard' %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
