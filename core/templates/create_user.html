<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новый пользователь</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width: 500px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Новый пользователь</h1>
        <a href="{% url 'manage_users' %}" class="btn btn-outline-secondary">Назад</a>
    </div>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Email (используется как логин)</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Фамилия</label>
            <input type="text" name="last_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Имя</label>
            <input type="text" name="first_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Отчество</label>
            <input type="text" name="patronymic" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Роль</label>
            <select name="role" class="form-select" required>
                {% for value, label in role_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Подгруппа</label>
            <select name="subgroup_id" class="form-select">
                <option value="">—</option>
                {% for subgroup in subgroups %}
                    <option value="{{ subgroup.pk }}">{{ subgroup }}</option>
                {% endfor %}
            </select>
            <div class="form-text">Обязательно для роли «Студент» и «Ассистент». Не используется для преподавателя.</div>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" name="is_admin" id="is_admin" class="form-check-input">
            <label class="form-check-label" for="is_admin">Администратор (только для роли «Преподаватель»)</label>
        </div>
        <button type="submit" class="btn btn-primary">Создать</button>
    </form>
</div>
</body>
</html>
