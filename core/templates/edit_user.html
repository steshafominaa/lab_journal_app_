<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Изменить пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width: 500px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Пользователь</h1>
        <a href="{% url 'manage_users' %}" class="btn btn-outline-secondary">Назад</a>
    </div>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <p class="text-muted">
        Email: {{ user_obj.email }} &middot; Роль: {{ profile.get_role_display }}
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Фамилия</label>
            <input type="text" name="last_name" class="form-control" value="{{ user_obj.last_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Имя</label>
            <input type="text" name="first_name" class="form-control" value="{{ user_obj.first_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Отчество</label>
            <input type="text" name="patronymic" class="form-control" value="{{ profile.patronymic }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Новый пароль</label>
            <input type="password" name="password" class="form-control" placeholder="Оставьте пустым, чтобы не менять">
        </div>

        {% if profile.role == 'teacher' %}
            <div class="mb-3 form-check">
                <input type="checkbox" name="is_admin" id="is_admin" class="form-check-input"
                       {% if role_obj.is_admin %}checked{% endif %}>
                <label class="form-check-label" for="is_admin">Администратор</label>
            </div>
        {% elif profile.role == 'assistant' or profile.role == 'student' %}
            <div class="mb-3">
                <label class="form-label">Подгруппа</label>
                <select name="subgroup_id" class="form-select" required>
                    {% for subgroup in subgroups %}
                        <option value="{{ subgroup.pk }}" {% if subgroup.pk == role_obj.subgroup_id %}selected{% endif %}>
                            {{ subgroup }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        {% endif %}

        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>
</body>
</html>
