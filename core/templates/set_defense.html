{% extends 'base.html' %}

{% block title %}Дата защиты{% endblock %}

{% block card_class %}content-card--narrow{% endblock %}

{% block content %}
    <h4>{{ student }} — {{ lab_work }}</h4>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Дата защиты</label>
            <input type="date" name="defense_date" class="form-control"
                   value="{{ defense.defense_date|date:'Y-m-d' }}">
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'teacher_dashboard' %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
{% endblock %}
