{% extends 'base.html' %}

{% block title %}Добавить дату занятия{% endblock %}

{% block card_class %}content-card--narrow{% endblock %}

{% block content %}
    <h4>Новая дата занятия</h4>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Дата</label>
            <input type="date" name="lesson_date" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Добавить</button>
        <a href="{% url 'attendance_dashboard' %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
{% endblock %}
