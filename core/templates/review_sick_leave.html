{% extends 'base.html' %}

{% block title %}Рассмотрение справки{% endblock %}

{% block card_class %}content-card--narrow{% endblock %}

{% block content %}
    <h4>Справка студента {{ sick_leave.student }}</h4>
    <p><a href="{{ sick_leave.file.url }}" target="_blank">Открыть файл справки</a></p>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Дата начала болезни</label>
            <input type="date" name="start_date" class="form-control"
                   value="{{ sick_leave.start_date|date:'Y-m-d' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Дата окончания болезни</label>
            <input type="date" name="end_date" class="form-control"
                   value="{{ sick_leave.end_date|date:'Y-m-d' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Статус</label>
            <select name="status" class="form-select">
                <option value="на рассмотрении" {% if sick_leave.status == "на рассмотрении" %}selected{% endif %}>
                    На рассмотрении
                </option>
                <option value="подтверждена" {% if sick_leave.status == "подтверждена" %}selected{% endif %}>
                    Подтверждена
                </option>
                <option value="отклонена" {% if sick_leave.status == "отклонена" %}selected{% endif %}>
                    Отклонена
                </option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'sick_leave_dashboard' %}" class="btn btn-outline-secondary">Назад</a>
    </form>
{% endblock %}
