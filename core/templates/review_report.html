<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка отчёта</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 500px; margin-top: 60px;">
    <h4>{{ lab_work.title }}</h4>
    <p>Студент: {{ student }}</p>

    <form method="post">
        {% csrf_token %}
        {% for row in criteria_rows %}
            <div class="mb-3">
                <label class="form-label">{{ row.criterion.name }} (макс. {{ row.criterion.max_score }})</label>
                <input type="number" step="0.1" min="0" max="{{ row.criterion.max_score }}"
                       name="criterion_{{ row.criterion.pk }}" class="form-control"
                       value="{{ row.result.score|default:0 }}">
            </div>
        {% endfor %}

        <div class="mb-3">
            <label class="form-label">Комментарий</label>
            <textarea name="comment" class="form-control" rows="3">{{ review.comment }}</textarea>
        </div>

        <p><strong>Текущая сумма баллов: {{ total }}</strong></p>

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'assistant_dashboard' %}" class="btn btn-outline-secondary">Назад</a>
    </form>
</div>
</body>
</html>
