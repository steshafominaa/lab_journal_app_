{% extends 'base.html' %}

{% block title %}Загрузить справку{% endblock %}

{% block card_class %}content-card--narrow{% endblock %}

{% block content %}
    <h4>Загрузить справку о болезни</h4>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Файл справки</label>
            <input type="file" name="file" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Загрузить</button>
        <a href="{% url 'student_dashboard' %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
{% endblock %}
