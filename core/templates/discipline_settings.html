{% extends 'base.html' %}

{% block title %}Настройки дисциплины{% endblock %}

{% block card_class %}content-card--narrow{% endblock %}

{% block content %}
    <h4>Настройки дисциплины</h4>
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Вес оценки за лабораторные (0–1)</label>
            <input type="number" step="0.01" min="0" max="1" name="lab_weight" class="form-control"
                   value="{{ settings.lab_weight }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Вес оценки за экзамен (0–1)</label>
            <input type="number" step="0.01" min="0" max="1" name="exam_weight" class="form-control"
                   value="{{ settings.exam_weight }}" required>
        </div>
        <p class="text-muted small">Сумма весов должна быть равна 1.</p>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'teacher_dashboard' %}" class="btn btn-outline-secondary">Назад</a>
    </form>
{% endblock %}
