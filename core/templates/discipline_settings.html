{% extends 'base.html' %}

    {% block title %}Настройки весов{% endblock %}

{% block card_class %}content-card--narrow{% endblock %}

{% block content %}
    <h4>Настройки весов</h4>
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Вес оценки за лабораторные (0–1)</label>
            <input type="number" step="0.01" min="0" max="1" name="lab_weight" id="lab_weight" class="form-control"
                   value="{{ settings.lab_weight }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Вес оценки за экзамен (0–1)</label>
            <input type="number" step="0.01" min="0" max="1" name="exam_weight" id="exam_weight" class="form-control"
                   value="{{ settings.exam_weight }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'teacher_dashboard' %}" class="btn btn-outline-secondary">Назад</a>
    </form>
{% endblock %}

{% block extra_js %}
    <script>
        function linkWeightInputs(idA, idB, min, max) {
            var a = document.getElementById(idA);
            var b = document.getElementById(idB);
            if (!a || !b) return;
            function sync(changed, other) {
                changed.addEventListener('input', function () {
                    var value = parseFloat(changed.value);
                    if (isNaN(value)) return;
                    var counterpart = Math.min(max, Math.max(min, 1 - value));
                    other.value = counterpart.toFixed(2);
                });
            }
            sync(a, b);
            sync(b, a);
        }
        linkWeightInputs('lab_weight', 'exam_weight', 0, 1);
    </script>
{% endblock %}
