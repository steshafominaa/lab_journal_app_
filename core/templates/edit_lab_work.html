<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Изменить лабораторную работу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width: 500px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Лабораторная работа</h1>
        <a href="{% url 'manage_lab_works' %}" class="btn btn-outline-secondary">Назад</a>
    </div>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" name="title" class="form-control" value="{{ lab_work.title }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Дедлайн отчёта</label>
            <input type="date" name="report_deadline" class="form-control"
                   value="{{ lab_work.report_deadline|date:'Y-m-d' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Дедлайн защиты</label>
            <input type="date" name="defense_deadline" class="form-control"
                   value="{{ lab_work.defense_deadline|date:'Y-m-d' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Вес отчёта</label>
            <input type="number" step="0.01" min="0.01" max="0.99" name="report_weight" class="form-control"
                   value="{{ lab_work.report_weight }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Вес защиты</label>
            <input type="number" step="0.01" min="0.01" max="0.99" name="defense_weight" class="form-control"
                   value="{{ lab_work.defense_weight }}" required>
            <div class="form-text">Сумма веса отчёта и веса защиты должна быть равна 1.</div>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>
</body>
</html>
